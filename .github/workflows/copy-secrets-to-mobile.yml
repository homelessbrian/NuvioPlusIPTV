name: Copy Secrets to Mobile

# One-time helper: copies this repo's app secrets into homelessbrian/NuvioPlusIPTV-Mobile, so they
# don't have to be typed in again. Values are never printed. Delete this file afterwards.
#
# Secret needed here first:
#   COPY_TOKEN   fine-grained GitHub token for NuvioPlusIPTV-Mobile only, permission "Secrets: Read and write"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the secrets
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
          TARGET: homelessbrian/NuvioPlusIPTV-Mobile
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          TEST_BUILDS_PUBLISH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the COPY_TOKEN secret first."; exit 1; }
          copied=0; skipped=0
          for name in NUVIO_BACKEND_URL NUVIO_BACKEND_KEY TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET \
                      SIMKL_CLIENT_ID SIMKL_APP_NAME MDBLIST_CLIENT_ID GOOGLE_DRIVE_CLIENT_ID \
                      GOOGLE_DRIVE_CLIENT_SECRET PREMIUMIZE_CLIENT_ID IMDB_RATINGS_API_BASE_URL \
                      IMDB_TAPFRAME_API_BASE_URL INTRODB_API_URL TEST_BUILDS_PUBLISH_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then echo "Skipped $name (empty here)"; skipped=$((skipped+1)); continue; fi
            gh secret set "$name" -R "$TARGET" --body "$value"
            echo "Copied $name"; copied=$((copied+1))
          done
          echo "Done: $copied copied, $skipped skipped."
