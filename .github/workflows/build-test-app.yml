name: Build Test App

# Builds "Nuvio + IPTV Test" from the dev branch and sends the APK to the private test repo
# (homelessbrian/Nuvio_Testing) as a release, where the test app finds it through the tester-only
# service. Nothing is kept here. Run it by hand from the Actions tab.
#
# Secrets needed in this repo:
#   LIVETV_TESTER_KEY           the tester key (same as in the Cloudflare Worker)
#   TEST_BUILDS_PUBLISH_TOKEN   a GitHub token that can write to Nuvio_Testing (Contents: Read and write)
# Test builds older than a week are deleted (the newest one is always kept).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the test app's update prompt; blank = the last commit's title)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-build
  cancel-in-progress: true

env:
  TEST_REPO: homelessbrian/Nuvio_Testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Stops before building if the test APK would have nowhere private to go.
      - name: Check the test repo is private
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
          LIVETV_TESTER_KEY: ${{ secrets.LIVETV_TESTER_KEY }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the TEST_BUILDS_PUBLISH_TOKEN secret first."; exit 1; fi
          if [ -z "$LIVETV_TESTER_KEY" ]; then echo "::error::Add the LIVETV_TESTER_KEY secret first."; exit 1; fi
          private=$(gh api "repos/$TEST_REPO" --jq '.private' 2>/dev/null || echo "unknown")
          if [ "$private" != "true" ]; then
            echo "::error::$TEST_REPO must be private (it is: $private). Nothing was built or sent."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        env:
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          # IMDb ratings (episode ratings and the rating on details pages) come from Nuvio's
          # ratings services; without these the app has nowhere to ask, so no ratings show.
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          # Skip intro: IntroDB (introdb.app), a free and open timestamp service (no key needed to
          # read). A secret can point it elsewhere; otherwise the public address is used.
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            add NUVIO_SUPABASE_URL "$BACKEND"
            add NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*)
                # Official Nuvio accounts: the app's built-in nuvio.tv login pages are already right.
                ;;
              *)
                # Self-hosted server: its login pages live on the server itself.
                add TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                add DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                add AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          add IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          # The build reads some values from each file, so write both.
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      # A fixed key committed to the repo so every build can update the previous install.
      # To use your own private key instead, add a secret named LIVETV_KEYSTORE_BASE64
      # (store password / key password "livetvfork", alias "livetv").
      - name: Signing
        env:
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LIVETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$LIVETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.jks"
          else
            cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Name the test build
        run: |
          # "Nuvio + IPTV" -> "Nuvio + IPTV Test" in every language, so the two apps are easy to
          # tell apart on the home screen.
          for f in app/src/full/res/values*/livetv_app_name.xml; do
            sed -i 's#>\([^<]*\)</string>#>\1 Test</string>#' "$f"
          done
          grep -h "app_name" app/src/full/res/values/livetv_app_name.xml

      - name: Build APK
        env:
          # The test app's key for checking for new test builds (secret LIVETV_TESTER_KEY). Without it the
          # build works as before, but the test app can't update itself.
          LIVETV_TESTER_KEY: ${{ secrets.LIVETV_TESTER_KEY }}
        run: |
          chmod +x gradlew
          # The release lint check is skipped: it's slow and not needed for a test build.
          ./gradlew :app:assembleFullRelease --parallel --build-cache -PlivetvTestBuild=true \
            -x lintVitalAnalyzeFullRelease -x lintVitalReportFullRelease -x lintVitalFullRelease

      - name: Package OpenVPN 2 corresponding source
        run: |
          python3 vpn-android/ci/package-openvpn2-sources.py --output out/openvpn2-corresponding-source.tar.gz

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/full/release -name "*.apk" -exec cp {} out/ \;
          ls -la out

      # Test build: the single APK as it is (no zip to open), named so it's easy to spot.
      - name: Name the test APK
        run: |
          apk=$(ls out/*.apk | head -n 1)
          mv "$apk" "out/Nuvio-IPTV-Test-$(date -u +%Y%m%d-%H%M).apk"
          ls -la out

      - name: Send to the test repo
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          meta=app/build/outputs/apk/full/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$meta")
          name=$(jq -r '.elements[0].versionName' "$meta")
          case "$code" in ''|null|*[!0-9]*) echo "::error::Couldn't read the version code"; exit 1;; esac
          [ -n "$NOTES" ] || NOTES=$(git log -1 --format=%s)
          apk=$(ls out/Nuvio-IPTV-Test-*.apk | head -n 1)
          gh release create "test-$code" "$apk" "out/openvpn2-corresponding-source.tar.gz" -R "$TEST_REPO" --title "$name" \
            --notes "$NOTES" --prerelease
          echo "::notice title=Test build ready::$name was sent to the test repo; the test app will offer it."

      - name: Delete test builds older than a week
        env:
          GH_TOKEN: ${{ secrets.TEST_BUILDS_PUBLISH_TOKEN }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Newest first; the newest one is always kept.
          gh api "repos/$TEST_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | test("^test-[0-9]+$"))] | sort_by(.created_at) | reverse | .[1:][] | select(.created_at < "'"$cutoff"'") | .tag_name' \
            | while read -r old; do
                gh release delete "$old" -R "$TEST_REPO" --yes --cleanup-tag || true
              done
