# Merge a Nuvio release into the dev branch by hand, keeping the fork's side wherever both changed
# the same lines. Then fix anything the update broke, run "Build Test APK" and check it on a TV.
# Users only get it through "Release Nuvio + IPTV update" (which releases from main).
name: Merge Nuvio release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nuvio release tag to merge, e.g. 1.1.0-beta.3"
        required: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/NuvioMedia/NuvioTV.git"
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/remotes/upstream/release"
          # Where both sides changed the same lines, keep the fork's version for now;
          # the kit you upload next replaces those files with the combined versions.
          git merge --no-edit -X ours -m "Merge Nuvio $TAG" refs/remotes/upstream/release
          git push
          echo "Merged Nuvio $TAG. Now upload the matching nuvio-livetv-kit.zip." >> "$GITHUB_STEP_SUMMARY"
